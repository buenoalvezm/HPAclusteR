# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The vignette and examples must not reach out to the network during a
      # check run; the annotation databases are downloaded on demand only.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # pak resolves the Bioconductor-only Suggests (clusterProfiler,
      # org.Hs.eg.db, rrvgo, pcaMethods) on its own; no manual BiocManager
      # bootstrap is needed. Suggests are best effort: a package with no usable
      # binary for the platform is skipped without failing this step, so
      # everything that touches one guards on requireNamespace().
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Which optional packages actually resolved. Without this a run can go
      # green while silently never exercising the annotation code, because the
      # examples, tests and vignette all skip when these are missing.
      - name: Report optional dependency availability
        run: |
          optional <- c("clusterProfiler", "org.Hs.eg.db", "rrvgo",
                        "pcaMethods", "treemapify", "readr")
          available <- vapply(optional, requireNamespace, logical(1), quietly = TRUE)
          cat(sprintf("%-18s %s\n", names(available),
                      ifelse(available, "available", "MISSING - dependent checks will skip")),
              sep = "")
          if (any(!available)) {
            cat("\n::warning::Optional packages unavailable on this platform: ",
                paste(names(available)[!available], collapse = ", "),
                ". Enrichment examples, tests and vignette sections were skipped here.\n", sep = "")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
